name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [18, 20, 22, 24]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}

            - run: npm ci

            - run: npm test
